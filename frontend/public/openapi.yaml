openapi: 3.1.0
info:
  title: ITube API
  version: 0.1.0
  description: |
    REST API for the ITube video platform (Spring Boot backend).
    This file is the single source of truth for the API contract until the backend
    generates its own spec. Add each new endpoint here as it is built.
servers:
  - url: /api
    description: Local dev (Vite proxies /api to http://localhost:8080)
tags:
  - name: Videos
    description: Browsing and searching videos
paths:
  /videos:
    get:
      tags: [Videos]
      summary: List videos
      description: PLACEHOLDER - not implemented in the backend yet. Example of how to document an endpoint.
      parameters:
        - name: search
          in: query
          required: false
          description: Filters by title or channel name (case-insensitive).
          schema:
            type: string
      responses:
        '200':
          description: A list of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
components:
  schemas:
    Video:
      type: object
      required: [title, channel]
      properties:
        title:
          type: string
          example: How I would learn to code (if I could start over)
        channel:
          type: string
          example: Maya Makes
        views:
          type: string
          example: 842K views
        age:
          type: string
          description: Human-readable time since upload.
          example: 1 week ago
        duration:
          type: string
          example: "24:16"
        image:
          type: string
          description: Unsplash photo id used for the thumbnail.
          example: photo-1516321318423-f06f85e504b3
        avatar:
          type: string
          description: Letter shown in the channel avatar.
          example: M
        color:
          type: string
          description: Channel avatar background colour.
          example: "#d66b58"
